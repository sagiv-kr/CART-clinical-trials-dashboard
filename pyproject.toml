[project]
name = "cart-clinical-trials-dashboard"
version = "0.1.0"
description = "Streamlit dashboard of the CAR-T clinical trial landscape"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pandas==2.2.3",
    "plotly==6.7.0",
    "requests==2.32.4",
    "streamlit==1.45.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
